<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Tajwid</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1f2a24;--mut:#66726b;--pri:#1d6b4f;--pri2:#e3f1ea;--bd:#e4ded0;--ok:#1d6b4f;--no:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b261f;--tx:#e8efe9;--mut:#9aa8a0;--pri:#5fc79d;--pri2:#21352b;--bd:#2c3b32;--ok:#5fc79d;--no:#ef8a80}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b261f;--tx:#e8efe9;--mut:#9aa8a0;--pri:#5fc79d;--pri2:#21352b;--bd:#2c3b32;--ok:#5fc79d;--no:#ef8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2rem 0}
.sub{color:var(--mut);margin:0 0 12px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab,.chip,.btn,.opt{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
.tab[aria-selected="true"],.chip[aria-selected="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{white-space:nowrap;font-size:.9rem;padding:6px 12px}
.chip.done::after{content:" ✓"}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.card h3{margin:0 0 4px;color:var(--pri)}
.ar{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;direction:rtl;font-size:2rem;line-height:2.1;margin:6px 0}
.letters{font-size:1.5rem;background:var(--pri2);border-radius:8px;padding:2px 12px;display:inline-block}
.ex{background:var(--pri2);border-radius:10px;padding:10px 14px;margin-top:8px}
.ex small{color:var(--mut)}
.hl{color:var(--no);font-weight:700}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);background:var(--pri2)}
.opt.no{border-color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.note{font-size:.85rem;color:var(--mut)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Belajar Tajwid</h1>
  <p class="sub">Materi ringkas hukum bacaan, lalu uji pemahamanmu lewat latihan.</p>
  <div class="bar" aria-label="Progres materi"><i id="prog"></i></div>
  <p class="note" id="progtxt"></p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-t="materi">Materi</button>
    <button class="tab" role="tab" aria-selected="false" data-t="latihan">Latihan</button>
  </div>
  <section id="materi">
    <div class="chips" id="chips"></div>
    <div id="detail"></div>
  </section>
  <section id="latihan" class="hide"></section>
  <p class="note">Catatan: aplikasi ini alat bantu. Tajwid dipelajari dengan talaqqi (bertemu langsung) kepada guru; panjang mad dan detail bacaan mengikuti bimbingan gurumu.</p>
</div>
<script>
const T=[
{id:"nun",title:"Nun Sukun & Tanwin",intro:"Berlaku ketika nun sukun (نْ) atau tanwin bertemu salah satu huruf hijaiyah. Ada lima hukum.",rules:[
{n:"Izhar Halqi",l:"ء هـ ع ح غ خ",d:"Dibaca jelas tanpa dengung, karena huruf-hurufnya keluar dari tenggorokan.",ar:"مَنْ آمَنَ",e:"nun sukun bertemu alif (hamzah)"},
{n:"Idgham Bighunnah",l:"ي ن م و",d:"Dilebur ke huruf berikutnya disertai dengung (±2 harakat).",ar:"مَنْ يَقُولُ",e:"nun sukun bertemu ya"},
{n:"Idgham Bilaghunnah",l:"ل ر",d:"Dilebur ke huruf berikutnya tanpa dengung.",ar:"مِنْ رَبِّهِمْ",e:"nun sukun bertemu ra"},
{n:"Iqlab",l:"ب",d:"Nun sukun/tanwin dibaca seperti mim, disertai dengung, bibir hampir merapat.",ar:"مِنْ بَعْدِ",e:"nun sukun bertemu ba; dibaca “mim-ba’di”"},
{n:"Ikhfa Haqiqi",l:"ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك",d:"Dibaca samar antara izhar dan idgham, disertai dengung (±2 harakat). Ada 15 huruf.",ar:"أَنْتُمْ",e:"nun sukun bertemu ta"}]},
{id:"mim",title:"Mim Sukun",intro:"Berlaku ketika mim sukun (مْ) bertemu huruf setelahnya.",rules:[
{n:"Ikhfa Syafawi",l:"ب",d:"Mim sukun bertemu ba: dibaca samar di bibir dengan dengung.",ar:"تَرْمِيهِمْ بِحِجَارَةٍ",e:"mim sukun bertemu ba (Al-Fil: 4)"},
{n:"Idgham Mimi",l:"م",d:"Mim sukun bertemu mim: dilebur dengan dengung (±2 harakat).",ar:"لَهُمْ مَا",e:"mim sukun bertemu mim"},
{n:"Izhar Syafawi",l:"selain م dan ب",d:"Dibaca jelas di bibir tanpa dengung berlebih. Hati-hati dengan fa dan wau: jangan samar.",ar:"هُمْ فِيهَا",e:"mim sukun bertemu fa"}]},
{id:"mad",title:"Mad (Memanjangkan)",intro:"Memanjangkan bunyi huruf mad (ا و ي) sesuai sebabnya.",rules:[
{n:"Mad Thabi’i",l:"ا و ي",d:"Mad asli tanpa hamzah atau sukun sesudahnya. Panjang 2 harakat.",ar:"قَالَ",e:"alif setelah fathah, 2 harakat"},
{n:"Mad Wajib Muttasil",l:"mad + hamzah satu kata",d:"Huruf mad bertemu hamzah dalam satu kata. Wajib dipanjangkan 4–5 harakat.",ar:"جَاءَ",e:"mad dan hamzah dalam satu kata"},
{n:"Mad Jaiz Munfasil",l:"mad + hamzah beda kata",d:"Huruf mad di akhir kata, hamzah di awal kata berikutnya. Panjangnya mengikuti bacaan yang kamu pelajari dari guru (umumnya 4–5 harakat).",ar:"إِنَّا أَعْطَيْنَاكَ",e:"mad dan hamzah terpisah kata"}]},
{id:"lain",title:"Qalqalah, Ghunnah & Lam",intro:"Hukum bacaan penting lainnya yang sering muncul.",rules:[
{n:"Qalqalah",l:"ق ط ب ج د",d:"Huruf bersukun (atau diwaqafkan) dipantulkan sedikit. Hafalan: “qutbu jadin”.",ar:"قُلْ هُوَ اللَّهُ أَحَدٌ",e:"dal di akhir ayat saat waqaf → memantul"},
{n:"Ghunnah Musyaddadah",l:"نّ مّ",d:"Nun atau mim bertasydid wajib berdengung selama ±2 harakat.",ar:"إِنَّ",e:"nun bertasydid"},
{n:"Lam Jalalah (Tafkhim)",l:"لله setelah fathah/dhammah",d:"Lam pada lafaz Allah dibaca tebal bila didahului fathah atau dhammah.",ar:"قَالَ اللَّهُ",e:"didahului fathah → tebal"},
{n:"Lam Jalalah (Tarqiq)",l:"لله setelah kasrah",d:"Lam pada lafaz Allah dibaca tipis bila didahului kasrah.",ar:"بِاللَّهِ",e:"didahului kasrah → tipis"}]}
];
const Q=[
["Nun sukun bertemu huruf ب disebut…",["Ikhfa","Iqlab","Izhar","Idgham"],1,"Nun sukun/tanwin + ba = Iqlab, dibaca seperti mim."],
["Hukum bacaan مِنْ رَبِّهِمْ adalah…",["Idgham Bilaghunnah","Idgham Bighunnah","Ikhfa","Izhar Halqi"],0,"Nun sukun bertemu ra termasuk huruf ل ر → idgham tanpa dengung."],
["Panjang mad thabi’i pada قَالَ adalah…",["1 harakat","2 harakat","4 harakat","6 harakat"],1,"Mad thabi’i dibaca 2 harakat."],
["Huruf qalqalah adalah…",["ء هـ ع ح غ خ","ي ن م و","ق ط ب ج د","ل ر"],2,"Qalqalah: ق ط ب ج د (qutbu jadin)."],
["أَنْتُمْ mengandung hukum…",["Izhar Halqi","Idgham Bighunnah","Iqlab","Ikhfa Haqiqi"],3,"Nun sukun bertemu ta, salah satu dari 15 huruf ikhfa."],
["لَهُمْ مَا termasuk…",["Idgham Mimi","Ikhfa Syafawi","Izhar Syafawi","Iqlab"],0,"Mim sukun bertemu mim → idgham mimi."],
["Nun bertasydid pada إِنَّ dibaca…",["Tanpa dengung","Dengung ±2 harakat","Mad 6 harakat","Qalqalah"],1,"Ghunnah musyaddadah: dengung ±2 harakat."],
["Lam pada بِاللَّهِ dibaca…",["Tebal","Tipis","Dipantulkan","Dilebur"],1,"Didahului kasrah → tarqiq (tipis)."],
["جَاءَ termasuk…",["Mad Thabi’i","Mad Wajib Muttasil","Mad Jaiz Munfasil","Qalqalah"],1,"Mad dan hamzah dalam satu kata → wajib muttasil."],
["مَنْ آمَنَ termasuk…",["Izhar Halqi","Ikhfa","Iqlab","Idgham"],0,"Nun sukun bertemu hamzah (huruf tenggorokan) → izhar halqi."]
];
let S={done:{},best:0};
try{S=JSON.parse(localStorage.getItem("tajwid")||"")||S}catch(e){}
const save=()=>{try{localStorage.setItem("tajwid",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
let cur=0;
function prog(){const n=T.length,d=Object.keys(S.done).filter(k=>S.done[k]).length;$("prog").style.width=(d/n*100)+"%";$("progtxt").textContent=d+" dari "+n+" bab selesai"+(S.best?" · skor terbaik latihan: "+S.best+"/"+Q.length:"")}
function chips(){$("chips").innerHTML=T.map((t,i)=>`<button class="chip${S.done[t.id]?" done":""}" aria-selected="${i==cur}" data-i="${i}">${t.title}</button>`).join("")}
function detail(){const t=T[cur];$("detail").innerHTML=`<p>${t.intro}</p>`+t.rules.map(r=>`<div class="card"><h3>${r.n}</h3><span class="letters ar" style="font-size:1.4rem;line-height:1.8">${r.l.match(/[\u0600-\u06FF]/)?r.l:""}</span>${r.l.match(/[\u0600-\u06FF]/)?"":`<span class="note">${r.l}</span>`}<p>${r.d}</p><div class="ex"><div class="ar">${r.ar}</div><small>${r.e}</small></div></div>`).join("")+`<button class="btn p" id="mark">${S.done[t.id]?"Batalkan tanda selesai":"Tandai bab ini selesai"}</button>`;
$("mark").onclick=()=>{S.done[t.id]=!S.done[t.id];save();chips();detail();prog()}}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cur=+b.dataset.i;chips();detail()}};
let qi=0,sc=0,ans=false;
function quiz(){const el=$("latihan");
if(qi>=Q.length){if(sc>S.best){S.best=sc;save();prog()}el.innerHTML=`<div class="card"><h3>Selesai!</h3><p>Skormu <b>${sc}/${Q.length}</b>. ${sc>=8?"Bagus sekali, lanjutkan dengan talaqqi.":"Ulangi materi yang masih keliru, lalu coba lagi."}</p><button class="btn p" id="again">Ulangi latihan</button></div>`;$("again").onclick=()=>{qi=0;sc=0;quiz()};return}
const q=Q[qi];ans=false;
el.innerHTML=`<div class="card"><p class="note">Soal ${qi+1} dari ${Q.length}</p><p><b>${q[0]}</b></p>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}<p id="fb"></p><button class="btn p hide" id="next">${qi==Q.length-1?"Lihat skor":"Lanjut"}</button></div>`;
el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(ans)return;ans=true;const i=+b.dataset.i;if(i==q[2]){sc++;b.classList.add("ok")}else{b.classList.add("no");el.querySelector(`[data-i="${q[2]}"]`).classList.add("ok")}$("fb").textContent=q[3];$("next").classList.remove("hide")});
}
document.addEventListener("click",e=>{if(e.target.id=="next"){qi++;quiz()}});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x==b));const m=b.dataset.t=="materi";$("materi").classList.toggle("hide",!m);$("latihan").classList.toggle("hide",m);if(!m&&qi==0&&!ans)quiz()});
chips();detail();prog();
</script>
</body>
</html>
